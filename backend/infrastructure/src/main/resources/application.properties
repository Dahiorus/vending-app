## default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.default-produces-media-type=application/prs.hal-forms+json
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
# Swagger UI has no built-in CSRF awareness: without this, "Try it out" never sends
# X-XSRF-TOKEN and CSRF-protected endpoints (refresh, logout) always 403.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

## upload multipart files
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=150MB
spring.servlet.multipart.file-size-threshold=2KB

# password policy
app.password-policy.min-length=12
app.password-policy.max-length=24
app.password-policy.min-lower-case-char-count=1
app.password-policy.min-upper-case-char-count=1
app.password-policy.min-digit-count=1
app.password-policy.min-special-char-count=1

# Allowed CORS origins for browser clients (comma-separated). Keep empty to reject cross-origin requests by default.
# Must be set to concrete origin(s) (never "*") in every environment enabling CORS: allowCredentials is enabled
# for the refresh-token cookie, and Spring Security forbids wildcard origins with allowCredentials=true.
app.cors.allowed-origins=

spring.cache.jcache.config=classpath:ehcache.xml

# JWT issuer, required. jwt.public-key/jwt.private-key are optional PEM-encoded RSA keys;
# when absent an ephemeral key pair is generated at startup (tokens invalidated on restart).
jwt.issuer-uri=https://vending-app.dahiorus.me

# Refresh token cookie defaults. app.refresh-token-cookie.domain is optional; keep blank for host-only cookies.
app.refresh-token-cookie.name=refresh_token
app.refresh-token-cookie.path=/api/v1/authenticate
app.refresh-token-cookie.secure=true
app.refresh-token-cookie.same-site=Strict
