<label class="group flex cursor-pointer items-center gap-4">
  <span class="relative inline-block h-24 w-24 shrink-0">
    @if (displayedUrl(); as url) {
      <img
        [src]="url"
        [alt]="label()"
        class="h-24 w-24 rounded object-cover"
        data-testid="image-upload-preview"
        (error)="onImageError()"
      />
    } @else {
      <mat-icon
        class="!h-24 !w-24 !text-8xl text-gray-400"
        aria-hidden="true"
        data-testid="image-upload-fallback"
        >{{ fallbackIcon() }}</mat-icon
      >
    }

    <span
      class="absolute inset-0 flex items-center justify-center rounded bg-black/0 text-white opacity-0 transition group-hover:bg-black/40 group-hover:opacity-100"
      aria-hidden="true"
    >
      <mat-icon>photo_camera</mat-icon>
    </span>
  </span>

  <span class="flex flex-col gap-1">
    <span class="text-sm font-medium">{{ label() }}</span>
    <input
      type="file"
      [accept]="accept"
      data-testid="image-upload-input"
      (change)="onFileChange($event)"
    />
  </span>
</label>

@if (message(); as text) {
  <p class="mt-2 text-sm text-red-600" role="alert">{{ text }}</p>
}
